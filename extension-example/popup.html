<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #58a6ff;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      background: #161b22;
      border: 1px solid #30363d;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.disconnected { background: #f85149; }
    .dot.connecting { background: #d29922; animation: pulse 1s infinite; }
    .dot.connected { background: #3fb950; }
    @keyframes pulse { 50% { opacity: 0.3; } }

    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #161b22;
      color: #e6edf3;
      font-size: 13px;
      margin-bottom: 8px;
    }
    input:focus { outline: none; border-color: #58a6ff; }

    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 6px;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #238636;
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover { background: #2ea043; }
    .btn-secondary {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
    }
    .btn-secondary:hover { background: #30363d; }
    .btn-danger {
      background: #da3633;
      color: #fff;
    }
    .btn-danger:hover { background: #f85149; }

    .section {
      margin-top: 12px;
      padding: 10px 12px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
    }
    .section h2 {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .label { color: #8b949e; font-size: 12px; }
    .value { color: #3fb950; font-family: monospace; font-size: 12px; }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .model-item {
      padding: 4px 0;
      font-size: 12px;
      border-bottom: 1px solid #21262d;
    }
    .model-item:last-child { border-bottom: none; }
    .model-id { color: #58a6ff; font-family: monospace; }
    .model-desc { color: #8b949e; font-size: 11px; margin-top: 2px; }

    .api-info {
      margin-top: 12px;
      padding: 10px 12px;
      background: #0d1117;
      border: 1px solid #238636;
      border-radius: 6px;
    }
    .api-info h2 {
      font-size: 11px;
      color: #3fb950;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .api-field {
      margin-bottom: 8px;
    }
    .api-field .label {
      display: block;
      margin-bottom: 2px;
    }
    .api-value {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 11px;
      color: #e6edf3;
      word-break: break-all;
    }
    .copy-btn {
      cursor: pointer;
      color: #58a6ff;
      font-size: 14px;
      flex-shrink: 0;
      user-select: none;
    }
    .copy-btn:hover { color: #79c0ff; }

    .hint {
      margin-top: 8px;
      font-size: 11px;
      color: #8b949e;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>🤖 LLM Bridge</h1>

  <div class="status">
    <div class="dot disconnected" id="dot"></div>
    <span id="statusText">Disconnected</span>
  </div>

  <input type="text" id="urlInput" placeholder="https://llm-bridge.<subdomain>.workers.dev" />

  <button id="newRoomBtn" class="btn-primary">🚀 New Room</button>
  <button id="connectBtn" class="btn-secondary">Connect</button>
  <button id="disconnectBtn" class="btn-danger" style="display:none">Disconnect</button>

  <div class="section" id="roomInfo" style="display:none">
    <h2>Connection</h2>
    <div class="info-row">
      <span class="label">Room</span>
      <span class="value" id="roomId">-</span>
    </div>
    <div class="info-row">
      <span class="label">Models</span>
      <span class="value" id="modelCount">0</span>
    </div>
  </div>

  <div class="section" id="modelsSection" style="display:none">
    <h2>Registered Models</h2>
    <div id="modelList"></div>
  </div>

  <div class="api-info" id="apiInfo" style="display:none">
    <h2>🔑 API Configuration</h2>
    <div class="api-field">
      <span class="label">API Base URL</span>
      <div class="api-value">
        <span id="apiBaseUrl">-</span>
        <span class="copy-btn" id="copyBaseUrl">📋</span>
      </div>
    </div>
    <div class="api-field">
      <span class="label">API Key</span>
      <div class="api-value">
        <span id="apiKeyDisplay">-</span>
        <span class="copy-btn" id="copyApiKey">📋</span>
      </div>
    </div>
    <div class="hint">
      Use these as your OpenAI API base URL and API key in any OpenAI-compatible client.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
